<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRIUP ACT – น้องไตรอัพ ผู้ช่วยอัจฉริยะ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f6f1;--bg2:#e6f0e6;--card:#fff;--ink:#23332b;--mute:#66766e;--g1:#3f8f2f;--g2:#9ccc65;--line:#dbe5da;--bot:#eef5ec;--sky:#d6e8f7;--floor:#dfeadb;--teal:#4fd9c6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181a;--bg2:#17211f;--card:#1b2427;--ink:#e6efe9;--mute:#93a39b;--line:#2f3d3a;--bot:#243230;--sky:#2c4457;--floor:#22302b}}
:root[data-theme="dark"]{--bg:#12181a;--bg2:#17211f;--card:#1b2427;--ink:#e6efe9;--mute:#93a39b;--line:#2f3d3a;--bot:#243230;--sky:#2c4457;--floor:#22302b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:24px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--g2),var(--g1));display:grid;place-items:center;font-style:normal}
.top nav{display:flex;gap:20px;margin-left:auto;font-size:14px;color:var(--mute)}
.top nav a{color:inherit;text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent}
.top nav a.on{color:var(--ink);border-color:var(--g1)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 40px;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px}
.hero{overflow:hidden}
.hero h1{margin:0;font-size:clamp(24px,3.2vw,34px);font-weight:600;line-height:1.2}
.hero .txt{padding:24px 26px 6px}
.hero p{margin:8px 0 0;color:var(--mute);font-size:15px;line-height:1.6;max-width:60ch}
.stage{position:relative;height:clamp(380px,46vw,500px);margin-top:10px;background:linear-gradient(#f7f7fd,#eceef9);overflow:hidden}
.ctrl{position:absolute;right:12px;top:12px;display:flex;gap:8px;z-index:3}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.btn:hover{background:var(--bot)}
.walker{position:absolute;left:50%;bottom:3%;height:84%;cursor:pointer;aspect-ratio:550/950;transform:translateX(-50%)}
.shadow{position:absolute;left:12%;right:12%;bottom:-3%;height:6%;border-radius:50%;background:#0003;filter:blur(5px)}
.body{position:relative;width:100%;height:100%;transform-origin:50% 100%;}
.body img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.walking .body{animation:waddle .55s ease-in-out infinite}.walking .shadow{animation:shd .55s ease-in-out infinite}@keyframes shd{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.6}}.walker{transform:translateX(-50%)}.body{scale:var(--fx,1) 1}.talk.walking .body{animation:nod .5s ease-in-out infinite alternate}
@keyframes waddle{0%,100%{transform:rotate(calc(var(--lean,0deg) - 1.4deg)) translateY(0)}50%{transform:rotate(calc(var(--lean,0deg) + 1.4deg)) translateY(-2.2%)}}
@keyframes breathe{50%{transform:scaleY(1.015)}}
.talk .body{animation:nod .5s ease-in-out infinite alternate}
@keyframes nod{to{transform:translateY(-1.5%) rotate(-1.5deg)}}
.lid{position:absolute;transform:scaleY(0);transform-origin:top;transition:transform .07s ease-out;pointer-events:none}
.blink .lid{transform:scaleY(1)}
.glow{position:absolute;left:39.64%;top:51.89%;width:20.00%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#9ffff0cc 0,#5fe3d044 45%,transparent 70%);mix-blend-mode:screen;animation:beat 1.8s ease-in-out infinite;pointer-events:none}
.talk .glow{animation-duration:.6s}
@keyframes beat{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}
.say{position:absolute;left:50%;bottom:104%;transform:translate(-50%,6px);width:max-content;max-width:220px;background:var(--card);border:2px solid var(--sky);border-radius:16px;padding:7px 12px;font-size:13px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;text-align:center}
.say.on{opacity:1;transform:translate(-50%,0)}
.say:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top:8px solid var(--sky)}
#lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
#lines path{fill:none;stroke:var(--mute);stroke-width:1.5;opacity:.65;marker-end:url(#ar)}
#lines path.sel{stroke:var(--g1);stroke-width:2.5;opacity:1}
.co{position:absolute;width:27%;transform:translateY(-50%);font:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;color:var(--ink);z-index:3;display:block}
.co.L{left:12px;text-align:right}.co.R{right:12px;text-align:left}
.co b{display:block;font-size:14px;font-weight:600}.co span{display:block;font-size:12px;color:var(--mute);line-height:1.4;margin-top:2px}
.co.sel{border-color:var(--g1);box-shadow:0 0 0 3px #3f8f2f26}
.co em{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--g1);color:#fff;font-size:12px;margin:0 6px 1px 0}
.dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;padding:0;border-radius:50%;background:var(--g1);color:#fff;font:600 12px/1 inherit;display:grid;place-items:center;z-index:3;border:2px solid #fff;cursor:pointer}
.dot.sel{animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #3f8f2f88}100%{box-shadow:0 0 0 12px #3f8f2f00}}
.info{padding:14px 26px;background:var(--bot);border-top:1px solid var(--line);font-size:14.5px;line-height:1.65}
.info b{font-size:15px}.info p{margin:4px 0 0;color:var(--mute)}
@media (max-width:720px){.co,#lines{display:none}.stage{height:380px}}
.body img{-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(0deg,transparent,#000 3%,#000 97%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(0deg,transparent,#000 3%,#000 97%,transparent);mask-composite:intersect}
.say{font:500 13.5px "Prompt",system-ui,sans-serif;color:var(--ink);cursor:pointer;z-index:4;box-shadow:0 6px 18px #4a60a026}
.say.on{pointer-events:auto}.say:hover{border-color:var(--g1)}
.dot.hint{animation:ping 1s 4}.dot{display:none}#lines path.hint{animation:pulse 1s 4}@keyframes pulse{50%{stroke-width:4;opacity:1;stroke:var(--g1)}}@media (max-width:720px){.dot{display:grid}}
.tabs{padding:6px 22px 0}
.tl{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:14px}
.tl button{font:inherit;font-size:14px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 14px;cursor:pointer}
.tl button[aria-selected=true]{color:var(--ink);border-color:var(--g1);font-weight:600}
.pane{padding:18px 4px 24px;font-size:14.5px;line-height:1.7}
.pane[hidden]{display:none}
.pane p{margin:0 0 10px;max-width:68ch}
details{border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:9px}
details summary{cursor:pointer;font-weight:500}
details p{margin:8px 0 0;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--bot);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:14px}
.tag b{color:var(--g1)}
.quote{border-left:4px solid var(--g2);padding:6px 0 6px 14px;font-weight:500;margin:14px 0}
.chat{display:flex;flex-direction:column;height:min(680px,calc(100vh - 110px));min-height:480px;position:sticky;top:76px;overflow:hidden}
.head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.head .ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g2),var(--g1));display:grid;place-items:center;font-size:19px}
.head b{display:block;font-size:15px}.head span{font-size:12px;color:var(--mute)}
.head span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fcf7a;margin-right:6px}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;line-height:1.55;font-size:14.5px;white-space:pre-wrap;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.msg.bot{background:var(--bot);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--g1);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.typing i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mute);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-4px);opacity:.4}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}
.send{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.send input{flex:1;min-width:0;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bot);color:var(--ink);border-radius:14px;padding:11px 14px}
.go{font:inherit;font-weight:600;border:0;background:var(--g1);color:#fff;border-radius:14px;padding:0 20px;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:14px}.top{padding:12px 16px}.top nav{display:none}.chat{position:static;height:560px}}
@media (prefers-reduced-motion:reduce){.glow{animation:none;opacity:.7}.body{animation:none!important}}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:21;display:none;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 18px;background:var(--g1);color:#fff;font:600 14px "Prompt",system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 26px #3f8f2f55}
.head .x{margin-left:auto;display:none}
@media (max-width:900px){.fab{display:flex}.chat{position:fixed;top:auto;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 28px));height:min(580px,calc(100vh - 170px));min-height:0;z-index:20;display:none;box-shadow:0 24px 60px #0004}.chat.open{display:flex}.head .x{display:block}.wrap{padding-bottom:90px}}
.modal{position:fixed;inset:0;z-index:50;background:#0b1410d9;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(4px);animation:fade .2s}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.mbox{position:relative;width:min(94vw,900px);max-height:100%;display:flex;flex-direction:column;align-items:center}
.mx{position:absolute;right:8px;top:8px;background:#ffffffe6;color:#23332b;z-index:3}
.fig{position:relative;width:min(100%,calc((100vh - 190px)*var(--r)));border-radius:18px;overflow:hidden;box-shadow:0 30px 80px #0008}
.fig img{display:block;width:100%;height:auto}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hs{pointer-events:auto;cursor:pointer;outline:none}
.hit{fill:transparent}
.bx{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:9 6;opacity:0}
.hs:hover .bx,.hs:focus-visible .bx{opacity:1;stroke-width:3}
.hs.sel .bx{stroke:#7ff5e4;opacity:1;stroke-width:3.2;stroke-dasharray:none}
.hs.sel .hit{fill:#7ff5e426}
.ring{display:none;fill:none;stroke:#7ff5e4;stroke-width:3;transform-box:fill-box;}
.hs.sel .ring{display:block}
.mp{width:100%;background:var(--card);color:var(--ink);border-radius:16px;padding:11px 16px;margin-top:10px;max-height:150px;overflow:auto;font-size:14px;line-height:1.6}
.mt{display:flex;align-items:center;gap:10px}.mt b{font-size:15px;flex:1}.nav{display:flex;gap:6px}.nav .btn{padding:2px 12px;font-size:16px}
.mp p{margin:4px 0 0;color:var(--mute)}
.arw{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px #0006);animation:nudge 1.3s ease-in-out infinite alternate}
@keyframes nudge{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.arw{animation:none}}

.lay{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-mask-image:none!important;mask-image:none!important;pointer-events:none;z-index:1}
#pic{position:relative;z-index:2;-webkit-mask-image:none!important;mask-image:none!important;clip-path:polygon(0.00% 0.00%,100.00% 0.00%,100.00% 46.32%,70.55% 46.32%,70.55% 100.00%,29.45% 100.00%,29.45% 46.32%,0.00% 46.32%)}
.body .glow,.body .lid{z-index:3}
#aL{clip-path:polygon(0.00% 48.17%,34.11% 48.17%,34.11% 76.22%,29.47% 76.22%,29.47% 85.37%,0.00% 85.37%);transform-origin:23.16% 52.68%}#aR{clip-path:polygon(66.32% 48.17%,100.00% 48.17%,100.00% 85.37%,70.95% 85.37%,70.95% 76.22%,66.32% 76.22%);transform-origin:77.05% 52.68%}

.walking 
.walking 



@media (prefers-reduced-motion:reduce){.lay{animation:none!important}}






@media (prefers-reduced-motion:reduce){}







#aL{clip-path:polygon(0.00% 46.32%,33.09% 46.32%,33.09% 100.00%,0.00% 100.00%);transform-origin:23.27% 52.63%}
#aR{clip-path:polygon(66.91% 46.32%,100.00% 46.32%,100.00% 100.00%,66.91% 100.00%);transform-origin:76% 52.63%}
.walking #aL{animation:armsw 1.1s ease-in-out -.55s infinite}
.walking #aR{animation:armsw 1.1s ease-in-out infinite}
@keyframes armsw{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}

.lg{position:absolute;z-index:3;pointer-events:none;-webkit-mask-image:none!important;mask-image:none!important}
#gL{transform-origin:63% 13%}#gR{transform-origin:40% 13%}
.walking .lg{animation:stride 1.1s linear infinite}
.walking #gR{animation-delay:-.55s}
@keyframes stride{0%{rotate:-12deg;translate:0 0;animation-timing-function:ease-in-out}25%{rotate:0deg;translate:0 -5%;animation-timing-function:ease-in-out}50%{rotate:12deg;translate:0 0;animation-timing-function:linear}100%{rotate:-12deg;translate:0 0}}
@media (prefers-reduced-motion:reduce){.lg{animation:none!important}}

.walker{transition:opacity .4s,transform .6s ease}
.front.walking .lg{animation:stridef .9s linear infinite}
.front.walking #gR{animation-delay:-.45s}
@keyframes stridef{0%{rotate:-4deg;translate:0 0}25%{rotate:0deg;translate:0 -9%}50%{rotate:4deg;translate:0 0}100%{rotate:-4deg;translate:0 0}}
.front.walking .body{animation-duration:.45s}
.front.walking #aL{animation-duration:.9s;animation-delay:-.45s}
.front.walking #aR{animation-duration:.9s;animation-delay:0s}
.front.walking .shadow{animation-duration:.45s}

.body{transition:rotate .6s ease}
#aL,#aR,#gL,#gR{transition:rotate .6s ease}
.flying .body{transform-origin:50% 50%;animation:hov 1.4s ease-in-out infinite}
@keyframes hov{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
.flying .shadow{opacity:0}
.flying #aL{rotate:132deg}.flying #aR{rotate:-132deg}
.flying .lg{animation:kick .32s ease-in-out infinite alternate}
.flying #gR{animation-delay:-.16s}
@keyframes kick{from{rotate:-6deg;translate:0 0}to{rotate:6deg;translate:0 0}}
.ctrl{flex-wrap:wrap;justify-content:flex-end;left:12px}.btn.on{background:var(--g1);color:#fff;border-color:var(--g1)}@media (max-width:520px){.ctrl{gap:6px}.ctrl .btn{padding:5px 10px;font-size:12px}}.flying #aL{clip-path:polygon(0.00% 46.32%,29.64% 46.32%,29.64% 100.00%,0.00% 100.00%)}.flying #aR{clip-path:polygon(70.36% 46.32%,100.00% 46.32%,100.00% 100.00%,70.36% 100.00%)}.ctrl{display:none!important}
</style>

<body>
<header class="top"><div class="logo"><i>🌱</i>TRIUP ACT</div><nav aria-label="เมนูหลัก"><a class="on" href="#" onclick="return false">หน้าแรก</a><a href="#" onclick="return false">งานวิจัย</a><a href="#" onclick="return false">นวัตกรรม</a><a href="#" onclick="return false">ติดต่อ</a></nav></header>
<main class="wrap">
 <div>
  <section class="card hero">
   <div class="txt"><h1>น้องไตรอัพ ผู้ช่วยอัจฉริยะของ TRIUP ACT</h1></div>
   <div class="stage" id="stage">
    <div class="ctrl"><button class="btn mb" data-m="front" type="button">⬇ เดินมาหน้า</button><button class="btn mb" data-m="side" type="button">↔ เดินข้าง</button><button class="btn" id="walkBtn" type="button" aria-pressed="true">⏸ หยุดเดิน</button><button class="btn" id="blinkBtn" type="button">กระพริบตา</button></div>

<script>
(function(){
var CROP=[250,30,550,950],$=function(i){return document.getElementById(i)};
var stage=$('stage'),walker=$('walker'),body=$('body'),pic=$('pic'),say=$('say'),log=$('log'),inp=$('inp');

['aL','aR'].forEach(function(i){$(i).src=pic.src});
var EYES=[['lidL',412,318,73,72],['lidR',560,318,73,72]];
function build(){
 var s=pic.naturalWidth/CROP[2],sy=pic.naturalHeight/CROP[3];
 EYES.forEach(function(e){
  var c=$(e[0]),w=Math.round(e[3]*s),h=Math.round(e[4]*sy),x=c.getContext('2d'),ex=e[1]-CROP[0],ey=e[2]-CROP[1];
  c.width=w;c.height=h;
  c.style.left=(ex/CROP[2]*100)+'%';c.style.top=(ey/CROP[3]*100)+'%';c.style.width=(e[3]/CROP[2]*100)+'%';c.style.height=(e[4]/CROP[3]*100)+'%';
  x.drawImage(pic,ex*s,(393-CROP[1])*sy,e[3]*s,5*sy,0,0,w,h);
  x.strokeStyle='#2f6b3a';x.lineWidth=Math.max(2,w*.045);x.lineCap='round';
  x.beginPath();x.moveTo(w*.24,h*.56);x.quadraticCurveTo(w*.5,h*.7,w*.76,h*.56);x.stroke();
  try{x.globalCompositeOperation='destination-in';x.filter='blur('+(w*.05)+'px)';x.fillStyle='#000';x.beginPath();if(x.roundRect)x.roundRect(w*.1,h*.1,w*.8,h*.8,w*.2);else x.rect(w*.1,h*.1,w*.8,h*.8);x.fill();}catch(_){}
 });
}
if(pic.complete&&pic.naturalWidth)build();else pic.addEventListener('load',build);
function blink(n){walker.classList.add('blink');setTimeout(function(){walker.classList.remove('blink');if(n>1)setTimeout(function(){blink(n-1)},130)},140)}
(function loop(){setTimeout(function(){blink(Math.random()<.25?2:1);loop()},2200+Math.random()*3200)})();
$('blinkBtn').onclick=function(){blink(2)};
var talking=false;
var say=$('say'),sayT,modal=$('modal');
function hint(on){say.classList.toggle('on',on)}
function hello(){blink(2);hint(true);clearTimeout(sayT);sayT=setTimeout(function(){hint(false)},5000)}

function frame(t){
 if(!walking)return;
 var dt=Math.min(.05,(t-last)/1000||0);last=t;
 var stop=talking||!modal.hidden||document.hidden;

  var half=walker.offsetHeight*.4+12;

  walker.style.translate='0 '+(Math.sin(flyT*1.6)*stage.clientHeight*.09)+'px';
  walker.style.left=wx+'px';
  raf=requestAnimationFrame(frame);return;

   applyDepth();

  }else if(phase==='greet'){
   if(t>phaseT&&!stop){phase='out';phaseT=t+450;walker.style.opacity=0}
  }else if(t>phaseT){
   setMode('side');raf=requestAnimationFrame(frame);return;
  }

 }

  wx+=dir*SPEED*dt;

 }
 wx=Math.max(bd[0],Math.min(bd[1],wx));
